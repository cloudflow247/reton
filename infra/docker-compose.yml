services:
  app:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    volumes:
      - ..:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reton
      POSTGRES_USER: reton
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reton"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Builds the Inertia/React frontend. Runs `vite build --watch` so the
  # manifest + assets land in public/build (bind-mounted back to the host and
  # served by nginx). node_modules lives in a named volume so the container's
  # install isn't clobbered by — or written into — the host bind mount.
  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run build -- --watch"
    volumes:
      - ..:/var/www/html
      - vite_node_modules:/var/www/html/node_modules

  queue:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    command: php artisan queue:work --tries=3
    volumes:
      - ..:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis

  scheduler:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    # schedule:work is a long-running process that fires the scheduler every
    # minute — drives callbacks:expire and transfers:auto-release. No host cron.
    command: php artisan schedule:work
    volumes:
      - ..:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis

volumes:
  pgdata:
  vite_node_modules:
