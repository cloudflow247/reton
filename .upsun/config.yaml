applications:
  reton:
    type: php:8.5

    build:
      flavor: none

    hooks:
      build: |
        set -ex
        composer install --no-progress --no-interaction --optimize-autoloader --no-dev

    web:
      locations:
        /:
          root: public
          passthru: /index.php

    variables:
      php:
        memory_limit: 256M

    relationships:
      database: {}
      cache: {}
      horizon: {}

services:
  database:
    type: postgresql:18

  cache:
    type: redis:8.0

  horizon:
    type: redis-persistent:8.0

routes:
  https://{default}/:
    type: upstream
    upstream: reton:http