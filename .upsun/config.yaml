# Upsun configuration for Reton (Laravel 12 + Inertia + Horizon)
# https://developer.upsun.com/docs/get-started/stacks/laravel/

applications:
  reton:
    source:
      root: "/"

    type: "php:8.4"

    # Persistent disk for storage / bootstrap mounts (defaults showed disk: 0).
    disk: 512

    relationships:
      database: "database:postgresql"
      redis: "redis:redis"

    mounts:
      "/.config":
        source: "storage"
        source_path: "config"
      "bootstrap/cache":
        source: "storage"
        source_path: "bootstrap-cache"
      "storage":
        source: "storage"
        source_path: "storage"
      # Avoid storage:link on read-only deploy filesystem.
      "public/storage":
        source: "storage"
        source_path: "storage/app/public"

    web:
      locations:
        "/":
          root: "public"
          passthru: "/index.php"
          index:
            - index.php
          scripts: true
          allow: true
          expires: 1h
          headers:
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
        "/build":
          root: "public/build"
          scripts: false
          allow: true
          expires: 1y
          headers:
            Cache-Control: "public, max-age=31536000, immutable"

    hooks:
      build: |
        set -eux
        # Services are unavailable during build; keep artisan (package:discover) off real DB.
        export DB_CONNECTION=sqlite
        export DB_DATABASE=":memory:"
        export CACHE_STORE=array
        export SESSION_DRIVER=array
        export QUEUE_CONNECTION=sync
        composer --no-ansi --no-interaction install --no-progress --prefer-dist --optimize-autoloader --no-dev
        # Vite/TypeScript are in devDependencies; needed only for the asset build.
        npm ci
        npm run build
      deploy: |
        set -eux
        # Explicit paths: dash/sh may not expand bash brace lists.
        mkdir -p storage/framework/sessions
        mkdir -p storage/framework/cache/data
        mkdir -p storage/framework/views
        mkdir -p storage/logs
        mkdir -p storage/app/public
        mkdir -p bootstrap/cache
        # Mounted bootstrap/cache is empty on first boot; rediscover packages.
        php artisan package:discover --ansi
        php artisan migrate --force
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
        php artisan event:cache || true
        php artisan horizon:terminate || true

    build:
      flavor: none

    dependencies:
      php:
        composer/composer: "^2"
      nodejs:
        npm: "^10"

    runtime:
      extensions:
        - redis
        - pdo_pgsql
        - sodium
        - intl

    variables:
      php:
        memory_limit: 256M

    workers:
      horizon:
        commands:
          start: |
            php artisan horizon

    crons:
      scheduler:
        spec: "*/1 * * * *"
        commands:
          start: |
            php artisan schedule:run --verbose --no-interaction

services:
  database:
    type: postgresql:16
  redis:
    type: redis:7.2

routes:
  "https://{default}/":
    type: upstream
    upstream: "reton:http"
  "http://{default}/":
    type: redirect
    to: "https://{default}/"
